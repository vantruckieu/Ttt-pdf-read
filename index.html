<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trình Trích Xuất Truyện PDF (Bản Streaming)</title>
    <!-- Thư viện PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            line-height: 1.6; 
            margin: 0; 
            padding: 15px; 
            background-color: #f0f2f5; 
            color: #1c1e21; 
        }
        .header-card { 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
            position: sticky; 
            top: 10px; 
            z-index: 100; 
        }
        h2 { margin-top: 0; font-size: 20px; text-align: center; color: #050505; }
        
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: block;
            background: #1877f2;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(24, 119, 242, 0.2);
            margin-bottom: 15px;
            cursor: pointer;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .selection-panel {
            display: none;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .selection-panel label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .selection-panel select, .selection-panel input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        
        .btn-load {
            background: #28a745;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(40, 167, 69, 0.2);
        }
        .btn-load:active { background: #218838; }
        .btn-load:disabled { background: #6c757d; cursor: not-allowed; }

        .status { 
            font-size: 14px; 
            color: #65676b; 
            text-align: center;
            font-weight: bold; 
            word-wrap: break-word;
            margin-top: 10px;
            padding: 8px;
            border-radius: 4px;
        }
        .status.error { background: #ffe6e6; color: #dc3545; border: 1px solid #dc3545; }
        .status.success { background: #e6ffe6; color: #28a745; }
        .status.loading { background: #e6f2ff; color: #0056b3; }
        
        #output { 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            min-height: 60vh; 
            font-size: 18px; 
            outline: none;
            word-wrap: break-word;
        }
        .page-text {
            margin-bottom: 20px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 10px;
            white-space: pre-wrap; 
        }
    </style>
</head>
<body>

    <div class="header-card">
        <h2>📖 Đọc Truyện PDF Tối Ưu RAM</h2>
        
        <div class="file-upload-wrapper">
            <span>📂 1. Chọn file PDF truyện</span>
            <input type="file" id="pdf-upload" accept="application/pdf" />
        </div>

        <div id="selection-panel" class="selection-panel">
            <div id="outline-container" style="display: none;">
                <label>📄 2. Chọn phần muốn đọc (Mục Lục):</label>
                <select id="outline-start"></select>
                <select id="outline-end"></select>
            </div>

            <div id="page-container" style="display: none;">
                <label>📄 2. Chọn số trang muốn đọc:</label>
                <label style="font-weight: normal; font-size: 13px;">Từ trang:</label>
                <input type="number" id="page-start" min="1" value="1">
                <label style="font-weight: normal; font-size: 13px;">Đến trang (Tối đa <span id="max-pages">...</span>):</label>
                <input type="number" id="page-end" min="1" value="10">
            </div>

            <button id="btn-load-text" class="btn-load">▶️ 3. Bắt Đầu Bóc Chữ</button>
        </div>
        
        <div id="status-message" class="status">Đang chờ file...</div>
    </div>

    <div id="output" contenteditable="true">Văn bản truyện sẽ hiển thị ở đây sau khi bạn bấm Bắt Đầu Bóc Chữ...</div>

    <script>
        // Cấu hình Worker của PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // Bắt lỗi toàn cục hiển thị lên màn hình
        window.addEventListener('error', function(event) {
            showStatus('error', "Lỗi hệ thống: " + event.message);
        });
        window.addEventListener('unhandledrejection', function(event) {
            showStatus('error', "Lỗi tiến trình ngầm: " + event.reason);
        });

        const fileInput = document.getElementById('pdf-upload');
        const outputDiv = document.getElementById('output');
        const statusMsg = document.getElementById('status-message');
        const selectionPanel = document.getElementById('selection-panel');
        const outlineContainer = document.getElementById('outline-container');
        const pageContainer = document.getElementById('page-container');
        
        const outlineStartSel = document.getElementById('outline-start');
        const outlineEndSel = document.getElementById('outline-end');
        const pageStartInp = document.getElementById('page-start');
        const pageEndInp = document.getElementById('page-end');
        const maxPagesSpan = document.getElementById('max-pages');
        const btnLoadText = document.getElementById('btn-load-text');

        let currentPdf = null;
        let totalPages = 0;
        let outlineData = [];

        function showStatus(type, text) {
            statusMsg.className = `status ${type}`;
            statusMsg.textContent = text;
        }

        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            showStatus('loading', "⏳ Đang phân tích file (Streaming Mode)...");
            selectionPanel.style.display = "none";
            outputDiv.innerHTML = "";
            currentPdf = null;
            outlineData = [];
            
            try {
                // SỬ DỤNG STREAMING (URL.createObjectURL) THAY VÌ ĐỌC TOÀN BỘ VÀO RAM
                const fileUrl = URL.createObjectURL(file);
                
                // Tải PDF bằng URL
                const loadingTask = pdfjsLib.getDocument({url: fileUrl});
                currentPdf = await loadingTask.promise;
                totalPages = currentPdf.numPages;
                
                showStatus('loading', `⏳ Đang đọc cấu trúc ${totalPages} trang...`);
                
                // Thử lấy Mục Lục
                const outline = await currentPdf.getOutline();
                
                if (outline && outline.length > 0) {
                    outlineContainer.style.display = "block";
                    pageContainer.style.display = "none";
                    await parseOutline(outline);
                } else {
                    outlineContainer.style.display = "none";
                    pageContainer.style.display = "block";
                    maxPagesSpan.textContent = totalPages;
                    pageEndInp.max = totalPages;
                    pageEndInp.value = Math.min(10, totalPages); 
                }

                selectionPanel.style.display = "block";
                showStatus('success', `✅ File nạp thành công! (${totalPages} trang). Hãy chọn phần muốn đọc.`);

            } catch (error) {
                console.error(error);
                showStatus('error', "❌ Không thể đọc file PDF: " + error.message);
            }
        });

        // Đệ quy lấy Mục lục
        async function parseOutline(outlineItems) {
            outlineStartSel.innerHTML = "";
            outlineEndSel.innerHTML = "";
            outlineData = [];

            async function traverse(items, depth = "") {
                for (let item of items) {
                    let pageNum = null;
                    try {
                        if (item.dest) {
                            const destArray = typeof item.dest === 'string' ? await currentPdf.getDestination(item.dest) : item.dest;
                            if (destArray && destArray[0]) {
                                const pageIndex = await currentPdf.getPageIndex(destArray[0]);
                                pageNum = pageIndex + 1;
                            }
                        }
                    } catch (e) {
                        console.warn("Lỗi đọc một phần mục lục", e);
                    }
                    
                    if (pageNum !== null) {
                        outlineData.push({ title: depth + item.title, pageNum: pageNum });
                    }
                    if (item.items && item.items.length > 0) {
                        await traverse(item.items, depth + "— ");
                    }
                }
            }

            await traverse(outlineItems);

            if (outlineData.length === 0) {
                outlineContainer.style.display = "none";
                pageContainer.style.display = "block";
                maxPagesSpan.textContent = totalPages;
                pageEndInp.value = Math.min(10, totalPages);
                return;
            }

            outlineData.forEach((item, index) => {
                let optStart = document.createElement('option');
                optStart.value = index;
                optStart.textContent = `Trang ${item.pageNum}: ${item.title}`;
                outlineStartSel.appendChild(optStart);

                let optEnd = document.createElement('option');
                optEnd.value = index;
                optEnd.textContent = `Trang ${item.pageNum}: ${item.title}`;
                outlineEndSel.appendChild(optEnd);
            });

            if (outlineData.length > 1) {
                outlineEndSel.value = 1; 
            } else {
                outlineEndSel.value = 0;
            }
        }

        btnLoadText.addEventListener('click', async () => {
            if (!currentPdf) return;

            let startPage = 1, endPage = 1;

            if (outlineContainer.style.display === "block") {
                let startIndex = parseInt(outlineStartSel.value);
                let endIndex = parseInt(outlineEndSel.value);
                
                if (startIndex > endIndex) {
                    alert("Phần kết thúc phải nằm sau phần bắt đầu!");
                    return;
                }
                startPage = outlineData[startIndex].pageNum;
                endPage = (endIndex + 1 < outlineData.length) ? outlineData[endIndex + 1].pageNum - 1 : totalPages;
                if (endPage < startPage) endPage = startPage;
            } else {
                startPage = parseInt(pageStartInp.value);
                endPage = parseInt(pageEndInp.value);
                if (startPage < 1) startPage = 1;
                if (endPage > totalPages) endPage = totalPages;
                if (startPage > endPage) {
                    alert("Trang bắt đầu không thể lớn hơn trang kết thúc!");
                    return;
                }
            }

            outputDiv.innerHTML = "";
            btnLoadText.disabled = true;

            try {
                for (let pageNum = startPage; pageNum <= endPage; pageNum++) {
                    showStatus('loading', `⏳ Đang bóc chữ trang ${pageNum} / ${endPage}...`);
                    
                    const page = await currentPdf.getPage(pageNum);
                    const textContent = await page.getTextContent();
                    
                    let lastY = -1;
                    let pageText = "";
                    
                    textContent.items.forEach(item => {
                        if (lastY !== item.transform[5] && lastY !== -1) {
                            pageText += "\n";
                        }
                        pageText += item.str;
                        lastY = item.transform[5];
                    });
                    
                    if (pageText.trim().length > 0) {
                        const pageDiv = document.createElement('div');
                        pageDiv.className = 'page-text';
                        pageDiv.innerText = `--- [Trang ${pageNum}] ---\n` + pageText;
                        outputDiv.appendChild(pageDiv);
                    }
                    
                    // Xóa cache trang để giải phóng RAM
                    page.cleanup();

                    // Nhường luồng hiển thị
                    if (pageNum % 3 === 0) {
                        await new Promise(resolve => setTimeout(resolve, 10));
                    }
                }
                showStatus('success', `✅ Đã load xong nội dung từ trang ${startPage} đến ${endPage}!`);
            } catch (error) {
                console.error(error);
                showStatus('error', "❌ Lỗi khi bóc chữ: " + error.message);
            } finally {
                btnLoadText.disabled = false;
            }
        });
    </script>
</body>
</html>
