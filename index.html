<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trình đọc truyện DOCX</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>

  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --border: #e5e7eb;
      --ok-bg: #ecfdf3;
      --ok: #15803d;
      --warn-bg: #fff7ed;
      --warn: #b45309;
      --err-bg: #fef2f2;
      --err: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.65;
    }

    .app {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(17, 24, 39, 0.05);
    }

    .header {
      position: sticky;
      top: 8px;
      z-index: 10;
      padding: 14px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(18px, 4.8vw, 24px);
      margin: 0 0 10px 0;
    }

    .muted { color: var(--muted); font-size: 13px; margin: 0 0 12px 0; }

    .upload {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      text-align: center;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }

    .upload:hover { background: var(--primary-dark); }

    .upload input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 10px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 16px;
      background: #fff;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font-weight: 700;
      padding: 11px 14px;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      padding: 10px 12px;
      border: 1px solid transparent;
      word-break: break-word;
    }

    .status.success { background: var(--ok-bg); color: var(--ok); border-color: #bbf7d0; }
    .status.loading { background: var(--warn-bg); color: var(--warn); border-color: #fed7aa; }
    .status.error { background: var(--err-bg); color: var(--err); border-color: #fecaca; }

    .reader {
      padding: 14px;
      min-height: 58vh;
      font-size: clamp(17px, 4.2vw, 20px);
      background: #fff;
      border-radius: 14px;
      border: 1px solid var(--border);
      white-space: normal;
      word-break: break-word;
    }

    .reader p { margin: 0 0 1em; }
    .reader h1, .reader h2, .reader h3 { color: var(--primary); margin-top: 1.4em; }

    @media (max-width: 700px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .controls .btn { grid-column: 1 / -1; width: 100%; }
      .app { padding: 10px; }
      .header, .reader { padding: 12px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header card">
      <h1>📖 Trình đọc truyện từ DOCX</h1>
      <p class="muted">Chọn file DOCX, sau đó nhập khoảng trang muốn đọc (ví dụ: 10 → 100).</p>

      <label class="upload">
        📂 Chạm để chọn file DOCX
        <input
          type="file"
          id="docx-upload"
          accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        />
      </label>

      <div class="controls">
        <div class="field">
          <label for="page-start">Trang bắt đầu</label>
          <input type="number" id="page-start" min="1" value="1" inputmode="numeric" />
        </div>

        <div class="field">
          <label for="page-end">Trang kết thúc</label>
          <input type="number" id="page-end" min="1" value="1" inputmode="numeric" />
        </div>

        <button id="btn-read-range" class="btn" disabled>Đọc theo khoảng trang</button>
      </div>

      <div id="status-message" class="status loading">Đang kiểm tra hệ thống...</div>
    </section>

    <section id="output" class="reader">Nội dung truyện sẽ hiển thị ở đây.</section>
  </main>

  <script>
    const fileInput = document.getElementById('docx-upload');
    const outputDiv = document.getElementById('output');
    const statusMsg = document.getElementById('status-message');
    const pageStartInput = document.getElementById('page-start');
    const pageEndInput = document.getElementById('page-end');
    const readRangeBtn = document.getElementById('btn-read-range');

    let fullHtmlContent = '';
    let fullTextContent = '';

    function showStatus(type, text) {
      statusMsg.className = `status ${type}`;
      statusMsg.textContent = text;
    }

    // Heuristic phân trang theo ký tự để mô phỏng trang Word.
    // DOCX không lưu "số trang thực" một cách ổn định khi parse qua Mammoth.
    const CHARS_PER_PAGE = 1800;

    function estimateTotalPagesFromText(text) {
      const clean = (text || '').trim();
      if (!clean) return 0;
      return Math.max(1, Math.ceil(clean.length / CHARS_PER_PAGE));
    }

    function renderPageRange(startPage, endPage) {
      const cleaned = fullTextContent.trim();
      if (!cleaned) {
        showStatus('error', '❌ File không có nội dung văn bản để hiển thị.');
        outputDiv.textContent = '';
        return;
      }

      const totalPages = estimateTotalPagesFromText(cleaned);
      if (startPage < 1 || endPage < 1 || startPage > endPage) {
        showStatus('error', '❌ Khoảng trang không hợp lệ.');
        return;
      }
      if (startPage > totalPages) {
        showStatus('error', `❌ Trang bắt đầu vượt quá tổng số trang ước lượng (${totalPages}).`);
        return;
      }

      const safeEnd = Math.min(endPage, totalPages);
      const startIdx = (startPage - 1) * CHARS_PER_PAGE;
      const endIdx = safeEnd * CHARS_PER_PAGE;
      const slice = cleaned.slice(startIdx, endIdx).trim();

      if (!slice) {
        showStatus('error', '❌ Không có nội dung trong khoảng trang đã chọn.');
        return;
      }

      const paras = slice
        .split(/\n{2,}|\r\n{2,}/)
        .map(s => s.trim())
        .filter(Boolean)
        .map(p => `<p>${p.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</p>`)
        .join('');

      outputDiv.innerHTML = paras || `<p>${slice.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</p>`;
      showStatus('success', `✅ Đang hiển thị trang ${startPage} đến ${safeEnd} / ${totalPages} (ước lượng).`);
    }

    window.onload = function() {
      if (typeof mammoth === 'undefined') {
        showStatus('error', '❌ Không tải được thư viện Mammoth. Vui lòng kiểm tra mạng.');
      } else {
        showStatus('success', '✅ Sẵn sàng. Hãy chọn file DOCX để bắt đầu.');
      }
    };

    fileInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      showStatus('loading', '⏳ Đang đọc file DOCX...');
      outputDiv.textContent = '';
      readRangeBtn.disabled = true;

      const reader = new FileReader();
      reader.onload = function(loadEvent) {
        const arrayBuffer = loadEvent.target.result;

        mammoth.extractRawText({ arrayBuffer })
          .then(raw => {
            fullTextContent = raw.value || '';
            return mammoth.convertToHtml({ arrayBuffer });
          })
          .then(result => {
            fullHtmlContent = result.value || '';

            if (!fullTextContent.trim()) {
              showStatus('error', '❌ File DOCX không có chữ hoặc bị lỗi mã hóa.');
              return;
            }

            const totalPages = estimateTotalPagesFromText(fullTextContent);
            pageStartInput.value = '1';
            pageEndInput.value = String(Math.min(10, totalPages));
            pageStartInput.max = String(totalPages);
            pageEndInput.max = String(totalPages);
            readRangeBtn.disabled = false;

            outputDiv.innerHTML = fullHtmlContent;
            showStatus('success', `✅ Đã tải xong. Tổng số trang ước lượng: ${totalPages}. Nhập khoảng trang để đọc.`);

            if (result.messages && result.messages.length > 0) {
              console.warn('Cảnh báo từ Mammoth:', result.messages);
            }
          })
          .catch(err => {
            console.error(err);
            showStatus('error', '❌ Lỗi đọc file: ' + err.message);
          });
      };

      reader.onerror = function() {
        showStatus('error', '❌ Không thể đọc file từ thiết bị của bạn.');
      };

      reader.readAsArrayBuffer(file);
    });

    readRangeBtn.addEventListener('click', function() {
      if (!fullTextContent.trim()) {
        showStatus('error', '❌ Bạn chưa tải file DOCX.');
        return;
      }

      const start = Number(pageStartInput.value);
      const end = Number(pageEndInput.value);
      renderPageRange(start, end);
    });
  </script>
</body>
</html>
