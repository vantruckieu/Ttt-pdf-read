<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trình Trích Xuất Truyện PDF (Siêu Ổn Định)</title>
    
    <!-- Đổi sang JSDelivr: Ổn định và nhanh hơn ở mạng Việt Nam -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js"></script>
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            line-height: 1.6; 
            margin: 0; 
            padding: 15px; 
            background-color: #f0f2f5; 
            color: #1c1e21; 
        }
        .header-card { 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
            position: sticky; 
            top: 10px; 
            z-index: 100; 
        }
        h2 { margin-top: 0; font-size: 20px; text-align: center; color: #050505; }
        
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: block;
            background: #1877f2;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(24, 119, 242, 0.2);
            margin-bottom: 15px;
            cursor: pointer;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .selection-panel {
            display: none;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .selection-panel label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        .selection-panel select, .selection-panel input[type="number"] {
            width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ced4da;
            border-radius: 6px; font-size: 15px; box-sizing: border-box;
        }
        
        .btn-load {
            background: #28a745; color: white; border: none; width: 100%; padding: 12px;
            border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 2px 4px rgba(40, 167, 69, 0.2);
        }
        .btn-load:active { background: #218838; }
        .btn-load:disabled { background: #6c757d; cursor: not-allowed; }

        .status { 
            font-size: 14px; text-align: center; font-weight: bold; 
            word-wrap: break-word; margin-top: 10px; padding: 10px; border-radius: 4px;
        }
        .status.error { background: #ffe6e6; color: #dc3545; border: 1px solid #dc3545; }
        .status.success { background: #e6ffe6; color: #28a745; border: 1px solid #28a745; }
        .status.loading { background: #e6f2ff; color: #0056b3; border: 1px solid #0056b3; }
        
        #output { 
            background: #ffffff; padding: 20px; border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); min-height: 60vh; font-size: 18px; 
            outline: none; word-wrap: break-word;
        }
        .page-text {
            margin-bottom: 20px; border-bottom: 1px dashed #ccc; padding-bottom: 10px;
            white-space: pre-wrap; 
        }
    </style>
</head>
<body>

    <div class="header-card">
        <h2>📖 Trình Đọc PDF Truyện (Mới)</h2>
        
        <div class="file-upload-wrapper">
            <span>📂 1. Chạm vào đây để chọn file PDF</span>
            <input type="file" id="pdf-upload" accept="application/pdf" />
        </div>

        <div id="selection-panel" class="selection-panel">
            <div id="outline-container" style="display: none;">
                <label>📄 2. Chọn chương (File có Mục Lục):</label>
                <select id="outline-start"></select>
                <select id="outline-end"></select>
            </div>

            <div id="page-container" style="display: none;">
                <label>📄 2. Nhập số trang muốn đọc:</label>
                <div style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <span style="font-size: 12px;">Từ trang:</span>
                        <input type="number" id="page-start" min="1" value="1">
                    </div>
                    <div style="flex: 1;">
                        <span style="font-size: 12px;">Đến trang (Max: <span id="max-pages">...</span>):</span>
                        <input type="number" id="page-end" min="1" value="10">
                    </div>
                </div>
            </div>

            <button id="btn-load-text" class="btn-load">▶️ 3. Bắt Đầu Đọc</button>
        </div>
        
        <div id="status-message" class="status loading">Đang kiểm tra hệ thống...</div>
    </div>

    <div id="output" contenteditable="true">Nội dung truyện sẽ hiện ở đây...</div>

    <script>
        const fileInput = document.getElementById('pdf-upload');
        const outputDiv = document.getElementById('output');
        const statusMsg = document.getElementById('status-message');
        const selectionPanel = document.getElementById('selection-panel');
        const outlineContainer = document.getElementById('outline-container');
        const pageContainer = document.getElementById('page-container');
        
        const outlineStartSel = document.getElementById('outline-start');
        const outlineEndSel = document.getElementById('outline-end');
        const pageStartInp = document.getElementById('page-start');
        const pageEndInp = document.getElementById('page-end');
        const maxPagesSpan = document.getElementById('max-pages');
        const btnLoadText = document.getElementById('btn-load-text');

        let currentPdf = null;
        let totalPages = 0;
        let outlineData = [];

        function showStatus(type, text) {
            statusMsg.className = `status ${type}`;
            statusMsg.textContent = text;
        }

        // 1. Kiểm tra xem JavaScript có chạy không
        window.onload = function() {
            if (typeof pdfjsLib === 'undefined') {
                showStatus('error', '❌ Lỗi: Trình duyệt chặn tải PDF.js. Vui lòng tắt chặn quảng cáo hoặc đổi mạng.');
            } else {
                showStatus('success', '✅ Hệ thống đã sẵn sàng. Vui lòng chọn file.');
            }
        };

        // 2. Xử lý khi chọn file (Bắt lỗi ngay lập tức)
        fileInput.addEventListener('change', async (event) => {
            try {
                const file = event.target.files[0];
                if (!file) return;

                // Hiện status NGAY LẬP TỨC để báo hiệu có phản hồi
                showStatus('loading', "⏳ Đã nhận file. Đang khởi động bộ giải mã...");
                selectionPanel.style.display = "none";
                outputDiv.innerHTML = "";
                
                // Khởi tạo worker bên trong block này để bắt lỗi
                if (!pdfjsLib.GlobalWorkerOptions.workerSrc) {
                    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js';
                }

                const fileUrl = URL.createObjectURL(file);
                showStatus('loading', "⏳ Đang quét cấu trúc file (có thể mất vài giây)...");
                
                const loadingTask = pdfjsLib.getDocument({url: fileUrl});
                currentPdf = await loadingTask.promise;
                totalPages = currentPdf.numPages;
                
                const outline = await currentPdf.getOutline();
                
                if (outline && outline.length > 0) {
                    outlineContainer.style.display = "block";
                    pageContainer.style.display = "none";
                    await parseOutline(outline);
                } else {
                    outlineContainer.style.display = "none";
                    pageContainer.style.display = "block";
                    maxPagesSpan.textContent = totalPages;
                    pageEndInp.max = totalPages;
                    pageEndInp.value = Math.min(10, totalPages); 
                }

                selectionPanel.style.display = "block";
                showStatus('success', `✅ File hợp lệ (${totalPages} trang). Vui lòng chọn giới hạn đọc!`);

            } catch (error) {
                console.error("Lỗi nạp file:", error);
                showStatus('error', "❌ Lỗi đọc file: " + (error.message || "Không rõ nguyên nhân"));
            }
        });

        // 3. Hàm trích xuất mục lục
        async function parseOutline(outlineItems) {
            outlineStartSel.innerHTML = ""; outlineEndSel.innerHTML = ""; outlineData = [];

            async function traverse(items, depth = "") {
                for (let item of items) {
                    let pageNum = null;
                    try {
                        if (item.dest) {
                            const destArray = typeof item.dest === 'string' ? await currentPdf.getDestination(item.dest) : item.dest;
                            if (destArray && destArray[0]) {
                                const pageIndex = await currentPdf.getPageIndex(destArray[0]);
                                pageNum = pageIndex + 1;
                            }
                        }
                    } catch (e) {} 
                    
                    if (pageNum !== null) {
                        outlineData.push({ title: depth + item.title, pageNum: pageNum });
                    }
                    if (item.items && item.items.length > 0) await traverse(item.items, depth + "— ");
                }
            }

            await traverse(outlineItems);

            if (outlineData.length === 0) {
                outlineContainer.style.display = "none";
                pageContainer.style.display = "block";
                maxPagesSpan.textContent = totalPages;
                pageEndInp.value = Math.min(10, totalPages);
                return;
            }

            outlineData.forEach((item, index) => {
                let optStart = document.createElement('option');
                optStart.value = index; optStart.textContent = `[Trang ${item.pageNum}] ${item.title}`;
                outlineStartSel.appendChild(optStart);

                let optEnd = document.createElement('option');
                optEnd.value = index; optEnd.textContent = `[Trang ${item.pageNum}] ${item.title}`;
                outlineEndSel.appendChild(optEnd);
            });
            outlineEndSel.value = outlineData.length > 1 ? 1 : 0;
        }

        // 4. Nút bấm load chữ
        btnLoadText.addEventListener('click', async () => {
            if (!currentPdf) return;

            let startPage = 1, endPage = 1;

            if (outlineContainer.style.display === "block") {
                let startIndex = parseInt(outlineStartSel.value);
                let endIndex = parseInt(outlineEndSel.value);
                if (startIndex > endIndex) return alert("Phần kết thúc phải nằm sau phần bắt đầu!");
                startPage = outlineData[startIndex].pageNum;
                endPage = (endIndex + 1 < outlineData.length) ? outlineData[endIndex + 1].pageNum - 1 : totalPages;
                if (endPage < startPage) endPage = startPage;
            } else {
                startPage = parseInt(pageStartInp.value);
                endPage = parseInt(pageEndInp.value);
                if (startPage < 1) startPage = 1;
                if (endPage > totalPages) endPage = totalPages;
                if (startPage > endPage) return alert("Trang bắt đầu không thể lớn hơn trang kết thúc!");
            }

            outputDiv.innerHTML = "";
            btnLoadText.disabled = true;

            try {
                for (let pageNum = startPage; pageNum <= endPage; pageNum++) {
                    showStatus('loading', `⏳ Đang đọc chữ trang ${pageNum} / ${endPage}...`);
                    
                    const page = await currentPdf.getPage(pageNum);
                    const textContent = await page.getTextContent();
                    
                    let lastY = -1; let pageText = "";
                    textContent.items.forEach(item => {
                        if (lastY !== item.transform[5] && lastY !== -1) pageText += "\n";
                        pageText += item.str; lastY = item.transform[5];
                    });
                    
                    if (pageText.trim().length > 0) {
                        const pageDiv = document.createElement('div');
                        pageDiv.className = 'page-text';
                        pageDiv.innerText = `--- [Trang ${pageNum}] ---\n` + pageText;
                        outputDiv.appendChild(pageDiv);
                    }
                    
                    page.cleanup();
                    // Chống treo máy
                    if (pageNum % 2 === 0) await new Promise(resolve => setTimeout(resolve, 10));
                }
                showStatus('success', `✅ Hoàn tất tải từ trang ${startPage} đến ${endPage}!`);
            } catch (error) {
                showStatus('error', "❌ Lỗi hiển thị chữ: " + error.message);
            } finally {
                btnLoadText.disabled = false;
            }
        });
    </script>
</body>
</html>
