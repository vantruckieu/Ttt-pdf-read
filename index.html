<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trình Trích Xuất Truyện PDF</title>
    <!-- Thư viện PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6; 
            margin: 0; 
            padding: 15px; 
            background-color: #f0f2f5; 
            color: #1c1e21; 
        }
        .header-card { 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
            position: sticky; 
            top: 10px; 
            z-index: 100; 
        }
        h2 { margin-top: 0; font-size: 20px; text-align: center; color: #050505; }
        
        /* Nút chọn file thiết kế to, dễ bấm trên cảm ứng */
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: block;
            background: #1877f2;
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(24, 119, 242, 0.2);
            margin-bottom: 15px;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        .status { 
            font-size: 14px; 
            color: #65676b; 
            text-align: center;
            font-weight: 500; 
        }
        
        /* Khung hiển thị text tối ưu cho đọc truyện */
        #output { 
            background: #ffffff; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            min-height: 60vh; 
            white-space: pre-wrap; /* Giữ nguyên khoảng trắng và xuống dòng */
            font-size: 18px; /* Cỡ chữ to dễ đọc trên điện thoại */
            outline: none;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="header-card">
        <h2>📖 Chuyển PDF thành Chữ</h2>
        
        <div class="file-upload-wrapper">
            <span>📂 Nhấn để chọn file PDF truyện</span>
            <input type="file" id="pdf-upload" accept="application/pdf" />
        </div>
        
        <div id="status-message" class="status">Đang chờ file...</div>
    </div>

    <!-- Khung chứa nội dung text (có thể chạm vào để sửa/xóa rác) -->
    <div id="output" contenteditable="true">Văn bản truyện sẽ hiển thị ở đây...</div>

    <script>
        // Cấu hình worker cho PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const fileInput = document.getElementById('pdf-upload');
        const outputDiv = document.getElementById('output');
        const statusMsg = document.getElementById('status-message');
        
        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            if (file.type !== 'application/pdf') {
                alert("Vui lòng chọn file định dạng PDF!");
                return;
            }

            statusMsg.style.color = "#d9534f";
            statusMsg.textContent = "⏳ Đang bóc tách chữ, vui lòng không tắt màn hình...";
            outputDiv.innerText = "";
            let fullText = "";
            
            const fileReader = new FileReader();
            
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                
                try {
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let numPages = pdf.numPages;
                    
                    for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                        statusMsg.textContent = `⏳ Đang xử lý trang ${pageNum} / ${numPages}...`;
                        
                        const page = await pdf.getPage(pageNum);
                        const textContent = await page.getTextContent();
                        
                        // Lấy chữ và xử lý xuống dòng mượt hơn cho truyện
                        let lastY = -1;
                        let pageText = "";
                        
                        textContent.items.forEach(item => {
                            if (lastY !== item.transform[5] && lastY !== -1) {
                                pageText += "\n"; // Xuống dòng khi tọa độ Y thay đổi
                            }
                            pageText += item.str;
                            lastY = item.transform[5];
                        });
                        
                        fullText += pageText + "\n\n"; 
                        outputDiv.innerText = fullText; // Cập nhật ngay lên màn hình
                    }
                    
                    statusMsg.style.color = "#28a745";
                    statusMsg.textContent = `✅ Đã xử lý xong ${numPages} trang!`;
                } catch (error) {
                    console.error(error);
                    statusMsg.style.color = "#dc3545";
                    statusMsg.textContent = "❌ Lỗi: Không thể đọc được chữ từ file PDF này (Có thể file là dạng ảnh quét).";
                }
            };
            
            fileReader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
